<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit Workspace Probe</title>
  </head>
  <body>
    <script>
      window.localStorage.setItem(
        'orbit-auth',
        JSON.stringify({
          user: {
            id: 1,
            username: 'Responsive Probe',
            is_online: true,
          },
          tokens: {
            access: 'probe-access-token',
            refresh: 'probe-refresh-token',
          },
        }),
      )

      window.localStorage.setItem('orbit-theme', 'dark')
      const params = new URLSearchParams(window.location.search)
      const nextPath = params.get('next') || '/app'
      window.location.replace(nextPath.startsWith('/') ? nextPath : '/app')
    </script>
  </body>
</html>
